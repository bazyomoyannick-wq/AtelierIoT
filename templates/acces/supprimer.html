{% extends 'base.html' %}
{% block contenu %}
<h2>Supprimer {{ element.nom }} ?</h2>
<p>Pour bloquer un badge tout en gardant sa trace, il vaut mieux le <strong>désactiver</strong>.
Une suppression est inscrite dans l’historique des suppressions avec votre nom et la date.</p>
<form method="post">{% csrf_token %}<button>Confirmer la suppression</button></form>
<p><a href="{% url 'acces-gestion' type_element %}">Annuler</a></p>
{% endblock %}
