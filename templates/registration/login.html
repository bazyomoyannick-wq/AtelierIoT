{% extends 'base.html' %}
{% block contenu %}
<h2>Connexion</h2>
{% if form.errors %}<p class="message error">Identifiant ou mot de passe incorrect.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button>Se connecter</button>
</form>
<p>Pas encore de compte ? <a href="{% url 'inscription' %}">Créer un compte utilisateur</a></p>
{% endblock %}
